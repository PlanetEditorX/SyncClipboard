name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的标签时触发，例如 v1.0.0

# 默认只读，只有 release job 获取写权限
permissions:
  contents: read

jobs:
  # ==============================
  # Windows 构建
  # ==============================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Windows build script
        shell: pwsh
        run: python release/build.py

      - name: Package Windows dist folder
        shell: pwsh
        run: |
          if (-not (Test-Path "release/dist")) {
            throw "Windows build output directory release/dist does not exist"
          }

          Compress-Archive `
            -Path "release/dist/*" `
            -DestinationPath "SyncClipboard-Windows-${{ github.ref_name }}.zip" `
            -Force

      # 上传供 release job 使用
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: SyncClipboard-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  # ==============================
  # Android 构建
  # ==============================
  build-android:
    name: Build Android
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore Android release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $requiredSecrets = @(
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD'
          )
          foreach ($secretName in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$secretName").Value)) {
              throw "Missing GitHub Actions secret: $secretName"
            }
          }

          $keystorePath = Join-Path $env:GITHUB_WORKSPACE 'android/release-key.jks'
          $keystoreBytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)

          $properties = @(
            "storeFile=release-key.jks",
            "storePassword=$($env:ANDROID_KEYSTORE_PASSWORD)",
            "keyAlias=$($env:ANDROID_KEY_ALIAS)",
            "keyPassword=$($env:ANDROID_KEY_PASSWORD)"
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'android/keystore.properties'),
            $properties,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build Android APK
        working-directory: android
        shell: pwsh
        run: |
          $versionName = '${{ github.ref_name }}'
          if ($versionName.StartsWith('v')) { $versionName = $versionName.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($versionName)) {
            throw 'Tag must contain a version after the v prefix'
          }

          $versionCode = 100000 + [int]${{ github.run_number }}
          .\gradlew.bat :app:assembleRelease --no-daemon "-PappVersionName=$versionName" "-PappVersionCode=$versionCode"

      - name: Prepare Android APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem `
            "android/app/build/outputs/apk/release" `
            -Filter "*.apk" |
            Select-Object -First 1

          if (-not $apk) {
            throw "Android APK was not produced"
          }

          Copy-Item `
            $apk.FullName `
            "SyncClipboard-Android-${{ github.ref_name }}.apk"

      # 上传供 release job 使用
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: SyncClipboard-Android-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 1

  # ==============================
  # 创建 GitHub Release
  # ==============================
  release:
    name: Create Release
    runs-on: ubuntu-latest

    # 两个构建 job 都成功后才发布
    needs:
      - build-windows
      - build-android

    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: android-package
          path: release-assets

      - name: Show release assets
        run: ls -la release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
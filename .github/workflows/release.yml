name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的标签时触发，例如 v1.0.0

# 默认只读，只有 release job 获取写权限
permissions:
  contents: read

# 说明：每次推 tag 都会顺带构建一次安卓 APK（复用 android.yml），
# 即使 android/ 没有改动 —— 这样 Release 里三个平台的产物版本号永远一致。
# 需要单独重出 APK 时，仍可手动运行 "Build Android" 工作流。

jobs:
  # ==============================
  # Windows 构建
  # ==============================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 发版前必须验证：打包配置（manifest / 排除项）与 UI 逻辑都有回归测试覆盖，
      # 这些用例只在本地跑过就发版风险太大。
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Run Windows build script
        shell: pwsh
        run: python release/build.py

      # 体积回归护栏：PySide6 的裁剪一旦失效，包会从 ~80MB 涨回 ~120MB
      - name: Check package size
        shell: pwsh
        run: |
          $size = (Get-ChildItem -Recurse "release/dist/SyncClipboard" |
                   Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($size / 1MB, 1)
          Write-Host "Windows package size: $mb MB"
          if ($mb -gt 110) {
            throw "打包体积 $mb MB 超过 110MB 阈值，检查 prune_qt_payload 是否失效"
          }

      - name: Package Windows dist folder
        shell: pwsh
        run: |
          if (-not (Test-Path "release/dist")) {
            throw "Windows build output directory release/dist does not exist"
          }

          Compress-Archive `
            -Path "release/dist/*" `
            -DestinationPath "SyncClipboard-Windows-${{ github.ref_name }}.zip" `
            -Force

      # 上传供 release job 使用
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: SyncClipboard-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  # ==============================
  # 安卓 APK：复用 android.yml，产物交给下面的 release job 统一上传
  # ==============================
  build-android:
    name: Build Android
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # ==============================
  # 创建 GitHub Release
  # ==============================
  release:
    name: Create Release
    runs-on: ubuntu-latest

    # Windows 包是硬前提：它失败就没必要发版。
    # APK 只是可选项：构建失败不阻塞发版，下载那一步会跳过并留下警告。
    needs:
      - build-windows
      - build-android
    if: ${{ always() && needs.build-windows.result == 'success' }}

    permissions:
      contents: write

    steps:
      # 必须放在 download-artifact 之前：checkout 默认会 git clean -ffdx，
      # 放后面会把刚下载的 Windows 包一起清掉。
      - name: Checkout shortcuts
        uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      # APK 是可选产物：构建失败时这里只提示，不阻断整条发版
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-package
          path: release-assets
        continue-on-error: true

      # iOS 快捷指令是协议的一部分：所有请求统一带 key 请求头后，旧版
      # .shortcut 下载会 403。必须随每个 tag 一起发布可导入的签名产物，
      # 否则 iOS 端无从升级。单独打成一个 zip，不放进 Windows 包里 ——
      # Windows 用户用不到，iOS 用户也不该为了 4 个文件去解压 38MB 的包。
      - name: Package iOS shortcuts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          tag = os.environ["TAG"]
          out = Path("release-assets") / f"SyncClipboard-iOS-Shortcuts-{tag}.zip"
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for name in ("文字同步", "推送同步", "获取同步", "短信同步"):
                  src = Path("shortcuts") / name / f"{name}.shortcut"
                  if not src.is_file():
                      raise SystemExit(f"缺少签名产物: {src}")
                  z.write(src, arcname=f"{name}.shortcut")
                  print("  +", src, src.stat().st_size, "B")
          print("saved", out, out.stat().st_size, "B")
          PY

      - name: Show release assets
        run: ls -la release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          append_body: true
          body: |
            > **升级说明**：Windows 用户下载 `SyncClipboard-Windows-${{ github.ref_name }}.zip` 解压覆盖；iOS 用户下载 `SyncClipboard-iOS-Shortcuts-${{ github.ref_name }}.zip`，重新导入 4 条快捷指令；安卓用户下载 `SyncClipboard-Android-${{ github.ref_name }}.apk` 覆盖安装。
            > 服务端与电脑端请保持同一版本，跨版本混用可能出现下载地址 403。通知来源已由程序在首次弹窗时自动注册，无需再运行任何注册脚本。
            > APK 随每次发版自动重建（即使安卓端没有改动），版本号与 Windows 包一致；需要单独重出时在 Actions 页手动运行 **Build Android** 工作流。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的标签时触发，例如 v1.0.0

# 默认只读，只有 release job 获取写权限
permissions:
  contents: read

# 说明：安卓端代码改动少，APK 不再跟随每个 tag 自动构建。
# 需要出 APK 时，手动运行 "Build Android" 工作流（android.yml），
# 它会自动取仓库最新的版本标签、用同样版本号构建，并把 APK 挂到对应的 Release 上。

jobs:
  # ==============================
  # Windows 构建
  # ==============================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Windows build script
        shell: pwsh
        run: python release/build.py

      - name: Package Windows dist folder
        shell: pwsh
        run: |
          if (-not (Test-Path "release/dist")) {
            throw "Windows build output directory release/dist does not exist"
          }

          Compress-Archive `
            -Path "release/dist/*" `
            -DestinationPath "SyncClipboard-Windows-${{ github.ref_name }}.zip" `
            -Force

      # 上传供 release job 使用
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: SyncClipboard-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  # ==============================
  # 创建 GitHub Release
  # ==============================
  release:
    name: Create Release
    runs-on: ubuntu-latest

    # Windows 构建成功后才发布（安卓包由 android.yml 手动补）
    needs:
      - build-windows

    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: Show release assets
        run: ls -la release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          append_body: true
          body: |
            > 安卓端如有改动，请在 Actions 页手动运行 **Build Android** 工作流，
            > 它会用本版本号构建 APK 并挂到这条 Release 上。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
